<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
/* 主题桥接:与博客同源(共享 localStorage 的 theme/hue 键),在首帧前应用深浅色并实时跟随。
   若被博客用同源 iframe 打开,父页写 localStorage 时本页 window 会收到 storage 事件。 */
(function () {
  "use strict";
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  function apply() {
    var root = document.documentElement;
    var theme = null, hue = null;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    try { hue = localStorage.getItem("hue"); } catch (e) {}
    /* theme 取值 "light" | "dark" | "auto"(未设置按 auto) */
    var dark = theme === "dark" || (theme !== "light" && mq.matches);
    root.classList.toggle("dark", !!dark);
    root.style.setProperty("--hue", (hue || "200").trim());
  }
  apply();
  window.addEventListener("storage", apply);
  if (mq.addEventListener) { mq.addEventListener("change", apply); }
})();
</script>
<style>
  *{box-sizing:border-box;}
  /* —— 主题令牌(与博客 variables.styl 同源取值;--hue 由上面 head 内联脚本按父页设置) —— */
  :root{
    --hue:200;
    --card-bg:white;
    --slot:oklch(0.93 0.010 var(--hue));
    --primary:oklch(0.70 0.14 var(--hue));
    --ink-strong:rgba(0,0,0,.92);
    --ink:rgba(0,0,0,.72);
    --ink-soft:rgba(0,0,0,.45);
    --line-soft:rgba(0,0,0,.08);
  }
  :root.dark{
    --card-bg:oklch(0.23 0.015 var(--hue));
    --slot:oklch(0.35 0.032 var(--hue));
    --primary:oklch(0.75 0.14 var(--hue));
    --ink-strong:rgba(255,255,255,.94);
    --ink:rgba(255,255,255,.72);
    --ink-soft:rgba(255,255,255,.5);
    --line-soft:rgba(255,255,255,.08);
  }
  html{background:var(--card-bg);}
  html, body{transition:background-color .2s ease, color .2s ease;}
  body{
    margin:0; min-height:100vh; color:var(--ink); background:transparent;
    font-family:"Roboto", system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    text-align:center; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  #scoreWrap{margin:clamp(12px,2.5vh,18px) 0 0; line-height:1;}
  #scoreWrap .lab{font-size:clamp(11px,2.4vw,13px); letter-spacing:.16em; color:var(--ink-soft); font-weight:500;}
  #scoreWrap .val{font-size:clamp(30px,6.5vw,46px); font-weight:700; line-height:1.1;
     font-variant-numeric:tabular-nums; color:var(--primary);}
  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
     padding:clamp(2px,1vh,8px);}
  #actImg{width:clamp(64px,15vw,100px); height:auto; max-height:clamp(64px,15vw,100px);
     object-fit:contain;}
  /* 箭头序列整排放进一条浅灰长条槽(暗色下为深灰槽) */
  #codeWrap{display:flex; align-items:center; justify-content:center;
     gap:clamp(5px,.9vw,10px); margin:clamp(12px,3vh,24px) 0 4px;
     padding:clamp(9px,1.8vh,16px) clamp(16px,3vw,26px);
     min-height:clamp(40px,7.5vh,54px);
     background:var(--slot); border-radius:clamp(12px,2.4vw,18px);
     box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}
  /* 战备倒计时:一条细进度条,在箭头序列正下方,随剩余时间变短;不足 30% 变红 */
  #cdTrack{width:min(clamp(140px,38vw,230px), 58%); height:clamp(5px,1.3vh,8px);
     margin:clamp(4px,1vh,10px) auto clamp(2px,.5vh,4px);
     background:var(--slot); border-radius:999px; overflow:hidden;
     box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}
  #cdBar{display:block; height:100%; width:100%; border-radius:999px;
     background:var(--primary); transition:width .08s linear;}
  #cdBar.low{background:#e5484d;}
  .chip{width:clamp(24px,5vw,34px); height:clamp(24px,5vw,34px);
     display:flex; align-items:center; justify-content:center;
     transition:transform .08s ease;}
  /* 原版箭头 PNG(黑色透明底);未输入稍淡,按对后加深;暗色下 invert 成白箭头 */
  .chip img{width:clamp(20px,4vw,28px); height:clamp(20px,4vw,28px); object-fit:contain;
     opacity:.5; transition:opacity .05s, filter .05s;}
  .chip.done{transform:translateY(-2px);}
  .chip.done img{opacity:1; filter:brightness(0) contrast(1.05);}
  :root.dark .chip img{filter:invert(1); opacity:.6;}
  :root.dark .chip.done img{filter:invert(1); opacity:1;}
  footer{display:flex; flex-direction:column; align-items:center;
     gap:clamp(4px,1vh,8px); padding:clamp(6px,1.4vh,10px) 0 clamp(12px,2.4vh,20px);}
  .frow{display:flex; justify-content:center; flex-wrap:wrap;}
  .frow + .frow{margin-top:clamp(6px,1.4vh,10px); padding-top:clamp(6px,1.4vh,10px);
     border-top:1px dashed var(--line-soft);}
  .m{text-align:center; min-width:clamp(64px,17vw,118px); padding:0 clamp(8px,1.8vw,16px);}
  .m + .m{border-left:1px solid var(--line-soft);}
  .m .lab{font-size:clamp(10px,2vw,13px); letter-spacing:.08em; color:var(--ink-soft); font-weight:500;}
  .m .val{font-size:clamp(20px,4.2vw,30px); font-weight:700; line-height:1.05;
     font-variant-numeric:tabular-nums; color:var(--ink-strong);}
  .frow2 .val{font-size:clamp(15px,3.2vw,23px);}

  /* —— 本地排行榜 / 结束面板(纯本机 localStorage,不联网) —— */
  #rankBtn{margin-top:clamp(4px,1vh,8px); font:inherit;
     font-size:clamp(11px,2.2vw,13px); letter-spacing:.08em; font-weight:500;
     color:var(--ink-soft); background:transparent; border:1px solid var(--line-soft);
     border-radius:999px; padding:clamp(4px,.8vh,6px) clamp(12px,2.4vw,18px);
     cursor:pointer; transition:color .15s, border-color .15s, background .15s;}
  #rankBtn:hover{color:var(--primary); border-color:var(--primary); background:var(--slot);}
  #overlay{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
     background:rgba(0,0,0,.38); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
     padding:clamp(12px,3vw,28px);}
  #overlay.open{display:flex;}
  .ov-card{width:min(100%,25rem); max-height:min(88vh,42rem); overflow:auto;
     background:var(--card-bg); color:var(--ink-strong);
     border-radius:clamp(12px,2.6vw,20px); border:1px solid var(--line-soft);
     box-shadow:0 18px 50px rgba(0,0,0,.38), 0 2px 10px rgba(0,0,0,.22);
     padding:clamp(16px,3vw,26px); text-align:left; overscroll-behavior:contain;}
  .ov-head{display:flex; align-items:baseline; justify-content:space-between; gap:8px;
     margin-bottom:clamp(6px,1.4vh,12px);}
  .ov-title{margin:0; font-size:clamp(17px,4vw,21px); font-weight:800; color:var(--ink-strong);}
  .ov-x{border:0; background:none; font:inherit; font-size:clamp(17px,3.8vw,21px); line-height:1;
     color:var(--ink-soft); cursor:pointer; padding:2px 6px; border-radius:8px;}
  .ov-x:hover{color:var(--primary); background:var(--slot);}
  .ov-note{margin:0 0 clamp(8px,1.6vh,13px); font-size:clamp(10px,2.2vw,12px);
     color:var(--ink-soft); line-height:1.5;}
  .ov-stats{display:grid; grid-template-columns:repeat(2,1fr);
     gap:clamp(6px,1.2vh,10px); margin-bottom:clamp(12px,2.4vh,18px);}
  .stat{border:1px solid var(--line-soft); background:var(--slot);
     border-radius:clamp(10px,2vw,14px); padding:clamp(7px,1.5vh,11px) clamp(10px,2.2vw,14px);}
  .stat .k{font-size:clamp(10px,2.2vw,12px); letter-spacing:.06em; color:var(--ink-soft); font-weight:500;}
  .stat .v{font-size:clamp(15px,3.4vw,21px); font-weight:800; color:var(--ink-strong);
     font-variant-numeric:tabular-nums; line-height:1.2;}
  .ov-input{width:100%; box-sizing:border-box; font:inherit; font-size:clamp(13px,3vw,15px);
     color:var(--ink-strong); background:transparent; border:1px solid var(--line-soft);
     border-radius:clamp(9px,2vw,12px); padding:clamp(8px,1.8vh,11px) clamp(10px,2.2vw,13px);
     outline:none; margin-bottom:clamp(10px,2vh,14px);}
  .ov-input::placeholder{color:var(--ink-soft);}
  .ov-input:focus{border-color:var(--primary);}
  .ov-actions{display:flex; gap:clamp(8px,1.8vw,12px);}
  .ov-btn{flex:1; font:inherit; font-weight:700; font-size:clamp(13px,3vw,15px); cursor:pointer;
     border-radius:clamp(10px,2vw,14px); padding:clamp(8px,1.8vh,11px) 0; transition:filter .15s;}
  .ov-btn:active{transform:translateY(1px);}
  .ov-btn.primary{background:var(--primary); color:#fff; border:0;}
  .ov-btn.primary:hover{filter:brightness(1.08);}
  .ov-btn.ghost{background:transparent; color:var(--ink-strong); border:1px solid var(--line-soft);}
  .ov-btn.ghost:hover{background:var(--slot); border-color:var(--primary); color:var(--primary);}
  .rec{border-bottom:1px solid var(--line-soft);}
  .rec summary{list-style:none; display:grid; grid-template-columns:auto 1fr auto auto; align-items:center;
     gap:clamp(6px,1.6vw,12px); padding:clamp(7px,1.5vh,10px) clamp(3px,.8vw,6px); cursor:pointer; border-radius:8px;}
  .rec summary::-webkit-details-marker{display:none;}
  .rec summary:hover{background:var(--slot);}
  .rec[open] summary .nm{color:var(--primary);}
  .rk{width:clamp(19px,4.2vw,24px); height:clamp(19px,4.2vw,24px); display:flex; align-items:center;
     justify-content:center; border-radius:50%; font-size:clamp(11px,2.4vw,13px); font-weight:800;
     color:var(--ink-soft); border:1px solid var(--line-soft);}
  .rec:nth-child(-n+3) .rk{color:var(--primary); border-color:var(--primary);}
  .nm{font-weight:700; font-size:clamp(13px,3vw,15px); overflow:hidden; text-overflow:ellipsis;
     white-space:nowrap; color:var(--ink-strong);}
  .sc{font-weight:800; font-size:clamp(14px,3.2vw,17px); color:var(--primary); font-variant-numeric:tabular-nums;}
  .tm{font-size:clamp(10px,2.2vw,12px); color:var(--ink-soft); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rec-detail{padding:clamp(5px,1.2vh,8px) clamp(3px,.8vw,6px) clamp(9px,1.8vh,13px);
     margin:0 0 clamp(2px,.4vh,4px) clamp(10px,2.2vw,14px); font-size:clamp(11px,2.4vw,13px);
     color:var(--ink); line-height:1.5; border-left:2px solid var(--primary);}
  .rec-new summary{border-radius:8px; box-shadow:inset 0 0 0 1px var(--primary);}
  .empty{margin:clamp(10px,2.4vh,18px) 0; font-size:clamp(12px,2.6vw,14px);
     color:var(--ink-soft); text-align:center;}
</style>
</head>
<body>
<div id="scoreWrap">
  <div class="lab">分数</div>
  <div class="val" id="statScore">0</div>
</div>

<main>
  <img id="actImg" alt="战备">
  <div id="codeWrap"></div>
  <div id="cdTrack" aria-hidden="true"><div id="cdBar"></div></div>
</main>

<footer>
  <div class="frow">
    <div class="m"><div class="lab">连击</div><div class="val" id="statCombo">0</div></div>
    <div class="m"><div class="lab">正确</div><div class="val" id="statCorrect">0</div></div>
    <div class="m"><div class="lab">错误</div><div class="val" id="statWrong">0</div></div>
  </div>
  <div class="frow frow2">
    <div class="m"><div class="lab">用时(秒)</div><div class="val" id="statTime">0.00</div></div>
    <div class="m"><div class="lab">总用时(秒)</div><div class="val" id="statTotal">0.00</div></div>
    <div class="m"><div class="lab">平均(秒)</div><div class="val" id="statAvg">0.00</div></div>
  </div>
  <button id="rankBtn" type="button">排行榜</button>
</footer>

<div id="overlay"></div>

  "TD-110 Bastion":"D R D L U R"
};

const ARROW = ["▲","◀","▼","▶"];
const LET = { U:0, L:1, D:2, R:3 };
const $ = id => document.getElementById(id);

const codeCache = new Map();
function fnv(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h>>>0; }
function codeFor(icon){
  const k = icon.name;
  if(codeCache.has(k)) return codeCache.get(k);
  let dirs = null;
  const off = OFFICIAL[k];
  if(typeof off === "string"){
    dirs = off.split(/\s*/).map(ch=>LET[ch]).filter(d=>typeof d==="number");
  }
  if(!dirs || dirs.length === 0){
    let h = fnv("SH::"+k);
    const len = 4 + ((h>>>2)%3);
    dirs = []; let prev=-1,pprev=-1,g=0;
    for(let i=0;i<len;i++){
      h=(Math.imul(h,1103515245)+12345)>>>0; let d=(h>>>16)%4;
      while(d===prev&&d===pprev&&g<24){ d=(d+1+(h%3))%4; h=(Math.imul(h,1664525)+1013904223)>>>0; g++; }
      dirs.push(d); pprev=prev; prev=d;
    }
    if(new Set(dirs).size<2) dirs[dirs.length>>1]=(dirs[dirs.length>>1]+1)%4;
  }
  codeCache.set(k, dirs);
  return dirs;
}

const S = {
  icons:HD1_ICONS, icon:null, code:[], step:0,
  combo:0, correct:0, wrong:0, score:0, t0:0,
  sessionT0:null, sumLap:0, lapN:0,
  maxCombo:0, panel:null, /* panel: null|"finish"|"board" */
  deadline:null, limit:2, /* 当前战备倒计时截止时刻(performance.now 基准,毫秒)与本条时限(秒); deadline=null 表示还没起表 */
};

function nextIcon(){
  /* 纯随机:每次独立等概率抽一只,同一只允许连续重复出现 */
  return S.icons[(Math.random() * S.icons.length) | 0];
}

function renderCard(){
  $("actImg").src = S.icon.uri;
  const w = $("codeWrap"); w.innerHTML = "";
  S.code.forEach((d,i)=>{
    const ch = document.createElement("div");
    ch.className = "chip";
    const img = ARROW_IMG[d];
    if(img){
      const im = document.createElement("img");
      im.src = img; im.draggable = false; im.alt = "";
      ch.appendChild(im);
    }else{
      ch.classList.add("glyph");
      ch.textContent = ARROW[d];
    }
    if(i < S.step) ch.classList.add("done");
    w.appendChild(ch);
  });
}
function renderStats(){
  $("statScore").textContent = S.score;
  $("statCombo").textContent = S.combo;
  $("statCorrect").textContent = S.correct;
  $("statWrong").textContent = S.wrong;
}
/* 时限随当前连击收紧:0-4→3.5s, 5-9→3s, 10-14→2.5s, 15-19→2s, 20+→1.5s */
function limitFor(c){ return c >= 20 ? 1.5 : c >= 15 ? 2 : c >= 10 ? 2.5 : c >= 5 ? 3 : 3.5; }
/* 本局是否已“开跑”:面板未开且至少按过一下(按对/按错都算) */
function live(){ return S.panel === null && (S.sessionT0 !== null || S.correct > 0 || S.wrong > 0); }
/* 给当前战备从头起一条完整倒计时(按当前连击定档) */
function armCode(){ S.limit = limitFor(S.combo); S.deadline = performance.now() + S.limit * 1000; }
function presentNext(){
  S.icon = nextIcon();
  S.code = codeFor(S.icon);
  S.step = 0;
  S.t0 = null; /* 本条用时:等按对第 1 个箭头才起表(handleDir 里设) */
  S.deadline = null;
  if(live()) armCode(); /* 开跑后从“战备出现”即开始倒计时;开局第一条等首次按键才起表 */
  renderCard();
}
function handleTimeout(){
  if(S.panel || S.deadline === null) return;
  /* 超时即整局失败:直接结束并跳数据界面 */
  endRun();
}
function updateTimer(){
  const now = performance.now();
  $("statTime").textContent  = (S.t0 === null ? 0 : (now - S.t0) / 1000).toFixed(2);
  const tot = (S.sessionT0 === null) ? 0 : (now - S.sessionT0) / 1000;
  $("statTotal").textContent = tot.toFixed(2);
  const avg = S.lapN ? (S.sumLap / S.lapN) / 1000 : 0;
  $("statAvg").textContent = avg.toFixed(2);
}
/* 倒计时进度条:每帧刷新;归零即超时换新战备 */
function cdLoop(now){
  const bar = $("cdBar");
  if(S.panel === null && S.deadline !== null){
    const remain = S.deadline - now;
    if(remain <= 0){
      handleTimeout();
      bar.style.width = "100%"; bar.classList.remove("low");
    }else{
      bar.style.width = Math.max(0, Math.min(1, remain / (S.limit * 1000))) * 100 + "%";
      bar.classList.toggle("low", remain < S.limit * 300); /* 剩不足 30% 变红 */
    }
  }else{
    bar.style.width = "100%"; bar.classList.remove("low"); /* 未开跑或面板打开:整条待命 */
  }
  requestAnimationFrame(cdLoop);
}
const DIRKEY = { arrowup:0, w:0, arrowleft:1, a:1, arrowdown:2, s:2, arrowright:3, d:3 };
function handleDir(d){
  if(S.deadline === null) armCode(); /* 开局第一次按键才让第一条的倒计时开始走 */
  if(d === S.code[S.step]){
    /* 总计时 + 本条用时:都从按对(本条的)第 1 个箭头起表 */
    if(S.sessionT0 === null) S.sessionT0 = performance.now();
    if(S.step === 0) S.t0 = performance.now();
    S.step++;
    renderCard();
    if(S.step === S.code.length){
      S.sumLap += performance.now() - S.t0;
      S.lapN++;
      S.combo++; S.correct++;
      if(S.combo > S.maxCombo) S.maxCombo = S.combo;
      /* 连击加成按每 5 次一档:1-4→+0,5-9→+100,10-14→+200… */
      S.score += 100 + 100 * Math.floor(S.combo / 5);
      renderStats();
      presentNext();
    }
  } else {
    S.wrong++; /* 按错:结束连击(清零),把当前序列退回重输;倒计时扣 0.2 秒 */
    S.combo = 0;
    S.step = 0;
    if(S.deadline !== null) S.deadline -= 200;
    renderStats();
    renderCard();
  }
}
function resetRun(){
  S.combo=0; S.correct=0; S.wrong=0; S.score=0; codeCache.clear();
  S.sumLap=0; S.lapN=0; S.sessionT0=null; S.maxCombo=0;
  closeOverlay();
  renderStats(); presentNext(); updateTimer();
}

/* ===== 本地排行榜(只存本机 localStorage,不登录不上传) ===== */
const REC_KEY = "strategyHeroRecords.v1";
const NAME_KEY = "strategyHeroName";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = v => { v = Number(v); return isFinite(v) ? v : 0; };
const fmtSec = t => (Math.round(num(t) * 100) / 100).toFixed(2);
function fmtDate(ts){
  const d = new Date(num(ts));
  if(isNaN(d.getTime())) return "";
  const p = n => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function loadRecords(){
  try{ const a = JSON.parse(localStorage.getItem(REC_KEY) || "[]"); return Array.isArray(a) ? a : []; }
  catch(_){ return []; }
}
function storeRecords(list){
  try{ localStorage.setItem(REC_KEY, JSON.stringify(list.slice(0, 200))); }catch(_){}
}
function openOverlay(html){
  const ov = $("overlay");
  ov.innerHTML = html;
  ov.classList.add("open");
}
function closeOverlay(){
  const ov = $("overlay");
  ov.classList.remove("open");
  ov.innerHTML = "";
  S.panel = null;
  if(live()) armCode(); /* 从排行榜/结束面板返回:给当前战备重新起表(等于暂停后恢复) */
}

/* 本局数据快照(面板打开后游戏按键已冻结,记录不会继续变) */
function snapshotRun(){
  const total = (S.sessionT0 === null) ? 0 : (performance.now() - S.sessionT0) / 1000;
  const avg = S.lapN ? (S.sumLap / S.lapN) / 1000 : 0;
  return { score:S.score, total:total, avg:avg };
}
function endRun(){
  /* 一局至少要按对过(或按错过)才值得收尾,否则 Enter 当无事发生 */
  if(S.sessionT0 === null && S.correct === 0 && S.wrong === 0) return;
  const d = snapshotRun();
  const stat = (k, v) => '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  openOverlay(
    '<div class="ov-card">'
    + '<div class="ov-head"><h2 class="ov-title">本局结束</h2>'
    +   '<button class="ov-x" type="button" data-cancel aria-label="关闭">✕</button></div>'
    + '<p class="ov-note">按 Enter 也可直接保存。成绩会写入排行榜(免登录、无需账号密码);断网时先存本机,联网后自动补传。</p>'
    + '<div class="ov-stats">'
    +   stat("分数", d.score)
    +   stat("总用时", fmtSec(d.total) + " s")
    +   stat("完成", S.lapN)
    +   stat("平均", fmtSec(d.avg) + " s")
    +   stat("正确", S.correct)
    +   stat("错误", S.wrong)
    +   stat("最大连击", S.maxCombo)
    + '</div>'
    + '<input id="ovName" class="ov-input" maxlength="15" placeholder="英文/数字名字(≤15,留空=Helldiver)" autocomplete="off">'
    + '<div class="ov-actions">'
    +   '<button class="ov-btn primary" type="button" data-save>保存到排行榜</button>'
    +   '<button class="ov-btn ghost" type="button" data-restart>重新开始</button>'
    + '</div></div>'
  );
  S.panel = "finish";
  const inp = $("ovName");
  if(inp){
    let nm=""; try{ nm = localStorage.getItem(NAME_KEY) || ""; }catch(_){}
    inp.value = sanitizeName(nm);
    inp.addEventListener("input", () => { inp.value = sanitizeName(inp.value); });
    inp.focus();
  }
}
/* 名字仅限英文/数字与简单符号(滤掉中文/emoji/引号等),最多 15 字符 */
function sanitizeName(s){
  return String(s || "").replace(/[^A-Za-z0-9 ._\-]/g, "").slice(0, 15).trim();
}
function saveRun(){
  const inp = $("ovName");
  let name = sanitizeName(inp && inp.value) || "Helldiver";
  try{ localStorage.setItem(NAME_KEY, name); }catch(_){}
  const d = snapshotRun();
  const rec = {
    id: Date.now() + "-" + ((Math.random() * 1e3) | 0),
    name: name,
    score: S.score,
    time: +fmtSec(d.total),
    laps: S.lapN,
    avg: +fmtSec(d.avg),
    correct: S.correct,
    wrong: S.wrong,
    maxCombo: S.maxCombo,
    ts: Date.now(),
  };
  const list = loadRecords();
  list.push(rec);
  storeRecords(list);
  resetRun(); /* 已在面板里收尾,存档后开新一局 */
  openBoard(rec.id);
}

/* === 云端同步(Firebase Realtime Database REST) ===
   本地始终先写一份;联网时把本地缺的记录逐条 POST 到云端,并拉回全表合并展示。
   断网时自动退回“仅本机”。数据库地址填在 CLOUD_URL;游客读写都免登录。 */
const CLOUD_URL = "https://strategy-hero-leaderboard-default-rtdb.asia-southeast1.firebasedatabase.app/scores.json";
function cloudRequest(body){
  return fetch(CLOUD_URL, {
    method: body === undefined ? "GET" : "POST",
    headers: body === undefined ? {} : { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  }).then(r => { if(!r.ok) throw new Error("http " + r.status); return r.json(); });
}
function mergeRecords(a, b){
  const m = new Map();
  for(const r of [].concat(a || [], b || [])){ if(r && typeof r.id === "string") m.set(r.id, r); }
  return [...m.values()];
}
async function syncCloud(){
  try{
    if(!CLOUD_URL) throw new Error("no cloud");
    const local = loadRecords();
    const remoteObj = await cloudRequest(undefined); /* Firebase:key→记录 的对象 */
    const remote = (remoteObj && typeof remoteObj === "object") ? Object.values(remoteObj) : [];
    const known = new Map(remote.map(r => [r.id, r]));
    const missing = local.filter(r => !known.has(r.id));
    for(const r of missing){ await cloudRequest(r); known.set(r.id, r); } /* 补传离线成绩 */
    const merged = mergeRecords(remote, local);
    storeRecords(merged);
    return { list: merged, online: true };
  }catch(_){
    return { list: loadRecords(), online: false };
  }
}
let boardToken = 0; /* 异步刷新竞态防护:关闭或重开后旧响应作废 */
function boardRows(list, hl){
  const all = list || [];
  if(!all.length) return '<p class="empty">还没有记录。<br>完成一局(超时结束后保存成绩)即可上榜,免登录。</p>';
  return all.slice().sort((a, b) => num(b.score) - num(a.score) || num(a.time) - num(b.time)).slice(0, 20).map((r, i) => {
    const cls = "rec" + (r.id === hl ? " rec-new" : "");
    return '<details class="' + cls + '"' + (r.id === hl ? " open" : "") + '>'
      + '<summary>'
      +   '<span class="rk">' + (i + 1) + '</span>'
      +   '<span class="nm">' + esc(r.name || "Helldiver") + '</span>'
      +   '<span class="sc">' + num(r.score) + '</span>'
      +   '<span class="tm">' + fmtSec(r.time) + "s</span>"
      + '</summary>'
      + '<div class="rec-detail">'
      +   "平均 " + fmtSec(r.avg) + "s · 正确 " + num(r.correct) + " · 错误 " + num(r.wrong)
      +   " · 最大连击 " + num(r.maxCombo) + " · " + fmtDate(r.ts)
      + '</div>'
      + '</details>';
  }).join("");
}
function renderBoard(list, hl, status){
  const total = list ? list.length : 0;
  const count = total > 20 ? ("显示前 20 · 共 " + total + " 个记录") : ("共 " + total + " 个记录");
  openOverlay(
    '<div class="ov-card"><div class="ov-head">'
    + '<h2 class="ov-title">排行榜</h2>'
    +   '<button class="ov-x" type="button" data-cancel aria-label="关闭">✕</button></div>'
    + '<p class="ov-note">' + count + ' · 按分数排序 · ' + status + '</p>'
    + boardRows(list, hl)
    + '</div>'
  );
}
function openBoard(hl){
  const tok = ++boardToken;
  S.panel = "board";
  renderBoard(loadRecords(), hl, CLOUD_URL ? "云端同步中…" : "仅本机(未连接云端)");
  syncCloud().then(r => {
    if(tok === boardToken && S.panel === "board"){
      renderBoard(r.list, hl, r.online ? "已同步 · 云端共享" : "未连上云端 · 仅本机");
    }
  });
}

$("rankBtn").addEventListener("click", () => openBoard(null));
$("overlay").addEventListener("click", e => {
  if(e.target.id === "overlay"){ closeOverlay(); return; } /* 点半透明背景:finish=放弃结束继续玩,board=关掉 */
  const t = e.target.closest ? e.target : null;
  if(t && t.closest("[data-save]")){ saveRun(); return; }
  if(t && t.closest("[data-restart]")){ resetRun(); return; }
  if(t && t.closest("[data-cancel]")){ closeOverlay(); return; }
});

window.addEventListener("keydown", e=>{
  if(e.repeat) return;
  const k = e.key.toLowerCase();
  if(S.panel){
    if(S.panel === "finish"){
      if(k === "enter"){ e.preventDefault(); saveRun(); return; }   /* 输入框内按 Enter 也是保存 */
      if(k === "r" && document.activeElement !== $("ovName")){ resetRun(); return; } /* 不保存重开 */
    }
    if(k === "escape"){ closeOverlay(); }
    return;
  }
  if(k === "r"){ resetRun(); return; }
  /* 不再支持按键结束本局:超时会自动跳数据界面 */
  if(typeof DIRKEY[k] === "number"){
    e.preventDefault();
    handleDir(DIRKEY[k]);
  }
});

presentNext();
renderStats();
setInterval(updateTimer, 100);
requestAnimationFrame(cdLoop);
</script>
</body>
</html>
